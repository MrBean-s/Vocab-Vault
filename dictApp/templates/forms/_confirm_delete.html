<div>
   <p class="mb-5">Are you sure you want to delete <strong>{{ type }} "{{ name }}"</strong>?</p>
   <form method="post" action="{{ delete_url }}">
      {% csrf_token %}
      <div class="mt-5 d-flex justify-content-end gap-3">
         <button type="submit" class="btn btn-outline-primary">Yes, delete</button>
         <button type="button" class="btn text-light" data-bs-dismiss="modal">Cancel</button>
      </div>
   </form>
</div>
