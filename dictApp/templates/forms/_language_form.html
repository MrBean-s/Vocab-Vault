<h5 id="genericModalTitle" hx-swap-oob="true"
	style="font-weight: 600; color: #ffffff;" class="modal-title ps-3">
  {% if is_edit %}Edit{% else %}Add{% endif %} Language
</h5>

{% if is_edit %}
	{% url 'lang_edit_form' edit_lang_id as target_url %}
{% else %}
	{% url 'lang_modal_form' as target_url %}
{% endif %}
<form action="{{target_url}}" method="POST" enctype="multipart/form-data">
	{% csrf_token %}

	<div class="mb-3">
		<label for="{{form.name.id_for_label}}" class="form-label">{{form.name.label}}</label>
		{{ form.name }}
	</div>

	<div class="mb-3">
		<label for="{{form.image_file.id_for_label}}" class="form-label">{{form.image_file.label}}</label>
		{{ form.image_file }}
	</div>

	<div class="mt-5 d-flex justify-content-end gap-3">
    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn" style="background: #bf562f;
      color: #fff; border: none;">
      Submit
    </button>
	
</form>
