<h5 id="genericModalTitle" hx-swap-oob="true"
   style="font-weight: 600; color: #ffffff;" class="modal-title">
   Link the word to a related term
</h5>

<form hx-post="{% url 'link_word' lang_id=lang_id word_id=word_id %}"
   hx-target="#genericModalBody"
   hx-swap="innerHTML"
   hx-target-error="#genericModalBody"
   enctype="multipart/form-data"
   style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
   {% csrf_token %}

   <div class="pt-3">
      {{form.word_1_id}}


      <div class="mb-5">
         <label for="{{form.word_2.id_for_label}}" class="form-label">
            {{form.word_2.label}}
         </label>
         {{form.word_2}}
      </div>

      <div class="mb-3 d-flex gap-2 align-items-center justify-content-between">
         <label for="{{form.relation_type.id_for_label}}" class="form-label w-30">
            Relation type
         </label>
         <div class="select-wrapper w-70">
            {{form.relation_type}}
         </div>
      </div>

      <div id="id_word_2-dropdownParent"></div>
      {% if form.non_field_errors %}
         {% for error in form.non_field_errors %}
         <div class="text-danger">{{ error }}</div>
         {% endfor %}
      {% endif %}
   </div>
   
   <div class="d-flex justify-content-end gap-3 pt-5">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="submit" class="btn btn-primary">
         Link
      </button>
   </div>
</form>
