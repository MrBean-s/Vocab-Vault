<form hx-post="{% url 'deck_quiz_settings' lang_id=lang_id deck_id=deck_id %}"
   hx-target="#genericModalBody"
   hx-swap="innerHTML"
   hx-target-error="#genericModalBody"
   enctype="multipart/form-data"
   style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
   {% csrf_token %}

   <div class="mb-4">
      <label class="form-label" for="{{form.quiz_type.id_for_label}}">{{form.quiz_type.label}}</label>
      {{form.quiz_type}}
   </div>

   
   <div class="mb-4 d-flex gap-5 align-items-center time-row">
      <div>
         <div class="form-check form-switch">
            <label class="form-check-label" for="{{ form.use_timer.id_for_label }}">
               {{form.use_timer.label}}
            </label>
            {{ form.use_timer }}
         </div>
         {{ form.use_timer.errors }}
      </div>
      <div id="quiz-time-section" class="d-none">
         <label class="form-label" for="{{form.time_per_question.id_for_label}}">{{form.time_per_question.label}}</label>
         {{form.time_per_question}}
         {{form.time_per_question.errors}}
      </div>
   </div>


   {% if form.non_field_errors %}
      {% for error in form.non_field_errors %}
      <div class="text-danger">{{ error }}</div>
      {% endfor %}
   {% endif %}

   <div class="d-flex justify-content-end gap-3 pt-5">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="submit" class="btn btn-primary">
         Link
      </button>
   </div>
</form>

<div data-modal-init="initQuizSettingsForm"></div>
