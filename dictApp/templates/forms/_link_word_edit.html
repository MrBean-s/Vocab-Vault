   
<form method="POST" action="{% url 'link_word_edit' lang_id=lang_id word_id=word_id rel_word_id=rel_word.id %}"
   class="modal-form">
   {% csrf_token %}
   <label for="{{form.relation_type.id_for_label}}" class="form-label">Relation type</label>
   
   <div class="select-wrapper">
      {{form.relation_type}}
   </div>
   <div class="d-flex justify-content-between mt-5">
      <a hx-get="{% url 'unlink_word' lang_id=lang_id word_id=word_id rel_word_id=rel_word.id %}"
         hx-target="#genericModalBody"
         hx-trigger="click" hx-target-error="#error-box"
         class="anchor-not-href">
         Unlink {{rel_word.name}}
      </a>
      <div>
         <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
         <button type="submit" class="ms-2 btn btn-primary">Update</button>
      </div>
   </div>
</form>
