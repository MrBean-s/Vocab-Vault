<form hx-post="{% url 'add_word_later' lang_id=lang_id %}"
   hx-target="#genericModalBody"
   hx-swap="innerHTML"
   style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
   {% csrf_token %}
   <div class="mb-3">
      <label for="{{form.word_name.id_for_label}}" class="form-label">{{form.word_name.label}}</label>
      {{form.word_name}}
      {{form.word_name.errors}}
   </div>

   {% if form.non_field_errors %}
      {% for error in form.non_field_errors %}
      <div class="text-danger">{{ error }}</div>
      {% endfor %}
   {% endif %}
   <div class="d-flex justify-content-end gap-3 pt-5">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="submit" class="btn btn-primary">Submit</button>
   </div>
</form>

<div data-modal-init="initSearchLaterForm"></div>
