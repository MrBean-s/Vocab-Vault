<form hx-post="{% url 'lang_add_set' %}"
      hx-target="#genericModalBody"
      hx-swap="innerHTML"
      hx-target-error="#genericModalBody"
      enctype="multipart/form-data">
   {% csrf_token %}

   <div class="my-3">
      <div class="form-label">Language Name:</div>
      {{ form.language }}
   </div>

   <div id="{{ form.language.id_for_label }}-dropdownParent"></div>

   <a href="{% url 'languages' %}">Cant find a language? Create one</a>

   <div class="pt-5 d-flex justify-content-end gap-3 pt-5">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">
      Submit
    </button>
   </div>
</form>

<div data-modal-init="initAddLanguageForm"></div>
