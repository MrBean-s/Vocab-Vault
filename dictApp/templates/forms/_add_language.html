<h5 id="genericModalTitle" hx-swap-oob="true"
   style="font-weight: 600; color: #ffffff;" class="modal-title ps-3">
  Add a language
</h5>

<form hx-post="{% url 'lang_add_set' %}"
      hx-target="#genericModalBody"
      hx-swap="innerHTML"
      hx-target-error="#genericModalBody"
      enctype="multipart/form-data">
   {% csrf_token %}

   <div class="my-3">
      <div class="form-label">Language Name:</div>
      {{ form.language }}
   </div>

   <a href="{% url 'languages' %}">Cant find a language? Create one</a>

   <div class="pt-5 d-flex justify-content-end gap-3">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">
      Submit
    </button>
   </div>
</form>

<script>
   reloadSelect2Items();
</script>
